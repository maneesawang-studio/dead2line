<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a Deadline account.">
  <meta name="robots" content="noindex,follow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" data-theme-color="light" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" data-theme-color="dark" media="(prefers-color-scheme: dark)">
  <script>
    (() => {
      let preference = "system";
      try {
        const savedTheme = localStorage.getItem("deadline-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          preference = savedTheme;
        } else {
          localStorage.removeItem("deadline-theme");
        }
      } catch (error) {
        preference = "system";
      }
      const systemIsDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = preference === "system" ? (systemIsDark ? "dark" : "light") : preference;
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
        meta.media = meta.dataset.themeColor === theme ? "all" : "not all";
      });
    })();
  </script>
  <meta name="apple-mobile-web-app-title" content="Deadline">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Deadline | Sign up</title>
  <link rel="icon" type="image/png" sizes="96x96" href="/Asset/Deadline-96.png">
  <link rel="apple-touch-icon" sizes="512x512" href="../Asset/Deadline-white-512.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body class="site-page" data-auth-page="signup" data-site-title="signUpTitle">
  <nav class="navbar" id="siteNavigation"></nav>

  <main class="site-main login-main">
    <section class="site-card login-card" aria-labelledby="signUpHeading">
      <div class="login-brand">
        <img src="../Asset/Deadline-512.png" alt="">
        <span>Deadline<span class="logo-dot">.</span></span>
      </div>
      <h1 id="signUpHeading" data-site-i18n="signUpHeading">Create your account</h1>
      <p class="site-lead" data-site-i18n="signUpLead">Create an account to organize your tasks and deadlines.</p>

      <form id="signUpForm" class="login-form" method="post">
        <div class="site-form-group">
          <label for="signUpEmail" data-site-i18n="email">Email</label>
          <input type="email" id="signUpEmail" name="email" autocomplete="email" required>
        </div>
        <div class="site-form-group">
          <label for="signUpPassword" data-site-i18n="password">Password</label>
          <input type="password" id="signUpPassword" name="password" autocomplete="new-password" required>
        </div>
        <div class="site-form-group">
          <label for="signUpPasswordConfirm" data-site-i18n="confirmPassword">Confirm password</label>
          <input type="password" id="signUpPasswordConfirm" name="password-confirm" autocomplete="new-password" required>
        </div>
        <p class="auth-status" id="authStatus" role="status" aria-live="polite" hidden></p>
        <button class="site-primary-button" id="signUpSubmit" type="submit" data-site-i18n="signUpButton">Create account</button>
      </form>

      <p class="login-note">
        <span data-site-i18n="alreadyAccount">Already have an account?</span>
        <a href="../login/" data-site-i18n="signIn">Sign in</a>
      </p>
    </section>
  </main>

  <script src="../site-pages.js"></script>
  <script src="../supabase-config.js"></script>
  <script src="../supabase-auth.js"></script>
</body>
</html>
