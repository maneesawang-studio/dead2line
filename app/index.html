<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage tasks and deadlines with clear categories, subtasks, and progress tracking.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" data-theme-color="light" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" data-theme-color="dark" media="(prefers-color-scheme: dark)">
  <script>
    (() => {
      let preference = "system";
      try {
        const savedTheme = localStorage.getItem("deadline-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          preference = savedTheme;
        } else {
          localStorage.removeItem("deadline-theme");
        }
      } catch (error) {
        preference = "system";
      }
      const systemIsDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = preference === "system" ? (systemIsDark ? "dark" : "light") : preference;
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
        meta.media = meta.dataset.themeColor === theme ? "all" : "not all";
      });
    })();
  </script>
  <script>
    (() => {
      let hasSession = false;
      try {
        for (let index = 0; index < localStorage.length; index += 1) {
          const key = localStorage.key(index);
          if (!key || !/^sb-.+-auth-token$/.test(key)) continue;
          let session;
          try {
            session = JSON.parse(localStorage.getItem(key));
          } catch (error) {
            continue;
          }
          if (session && session.access_token && session.refresh_token && session.user) {
            hasSession = true;
            break;
          }
        }
      } catch (error) {
        hasSession = false;
      }
      if (!hasSession) window.location.replace("/");
    })();
  </script>
  <meta name="apple-mobile-web-app-title" content="Deadline">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="96x96" href="/Asset/Deadline-96.png">
  <link rel="apple-touch-icon" sizes="512x512" href="../Asset/Deadline-white-512.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Deadline | Manage tasks and deadlines</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- ลิงก์ไปยังไฟล์ CSS -->
<link rel="stylesheet" href="../style.css">
</head>
<body data-auth-page="dashboard" data-nav-active="tasks">

  <!-- แถบเมนูด้านบน -->
  <nav class="site-navigation">
    <div class="site-navigation__inner">
    <a class="brand" href="../" aria-label="Deadline">
      <img src="../Asset/Deadline-512.png" alt="Deadline">
      <span class="brand__name">Deadline<span class="brand__dot">.</span></span>
    </a>
    <div class="account-menu">
      <button type="button" class="account-menu__trigger" id="btnProfile" aria-expanded="false" aria-label="Open settings menu" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 1.72l-.17 1.18a2 2 0 0 1-1 1.48l-.43.25a2 2 0 0 1-1.78.09l-1.07-.48a2 2 0 0 0-2.5.73l-.22.38a2 2 0 0 0 .5 2.55l.9.72a2 2 0 0 1 .71 1.65v.5a2 2 0 0 1-.71 1.65l-.9.72a2 2 0 0 0-.5 2.55l.22.38a2 2 0 0 0 2.5.73l1.07-.48a2 2 0 0 1 1.78.09l.43.25a2 2 0 0 1 1 1.48l.17 1.18A2 2 0 0 0 11.78 22h.44a2 2 0 0 0 2-1.72l.17-1.18a2 2 0 0 1 1-1.48l.43-.25a2 2 0 0 1 1.78-.09l1.07.48a2 2 0 0 0 2.5-.73l.22-.38a2 2 0 0 0-.5-2.55l-.9-.72a2 2 0 0 1-.71-1.65v-.5a2 2 0 0 1 .71-1.65l.9-.72a2 2 0 0 0 .5-2.55l-.22-.38a2 2 0 0 0-2.5-.73l-1.07.48a2 2 0 0 1-1.78-.09l-.43-.25a2 2 0 0 1-1-1.48l-.17-1.18A2 2 0 0 0 12.22 2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
      <div class="account-menu__panel" id="profileMenu">
        <div class="account-menu__account">
          <span id="accountLabel">Logged-in account</span>
          <strong id="accountEmail" data-i18n="previewAccount">Not signed in</strong>
        </div>
        <p class="status-message" id="authStatus" role="status" aria-live="polite" hidden></p>
        <button type="button" class="account-menu__item account-menu__item--theme" id="themeToggle">
          <span class="account-menu__theme-icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
            </svg>
          </span>
          <span id="themeLabel">Switch theme</span>
          <span class="account-menu__state" id="themeState">Light</span>
        </button>
        <button type="button" class="account-menu__item account-menu__item--theme" id="languageToggle">
          <span class="account-menu__theme-icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </span>
          <span id="languageLabel">Language</span>
          <span class="account-menu__state" id="languageState">English</span>
        </button>
        <a class="account-menu__item account-menu__item--link" href="../settings/" data-i18n="settings">Settings</a>
        <a class="account-menu__item account-menu__item--link" id="loginMenuLink" href="../login/" data-i18n="signIn">Sign in</a>
        <hr>
        <a class="account-menu__item account-menu__item--link" href="../privacy/" data-i18n="privacy">Privacy</a>
        <button type="button" class="account-menu__item account-menu__item--sign-out" id="signOutButton" data-i18n="signOut" hidden>Sign out</button>
      </div>
    </div>
    </div>
  </nav>

  <!-- พื้นที่เนื้อหาหลัก -->
  <main class="page-container">
    
    <!-- ส่วนหัว: วันที่และชื่อหน้า -->
    <header class="page-header">
      <p class="page-header__date" id="currentDate">Sunday, November 22, 2026</p>
      <h1 class="page-header__title" data-i18n="pageTitle">Manage tasks and deadlines</h1>
    </header>
    <p class="task-operation-status" id="taskOperationStatus" role="alert" aria-live="polite" hidden></p>

    <!-- แถบสรุปสถานะ และปุ่ม + Add -->
    <section class="dashboard-summary">
      <div class="dashboard-summary__stats">
        <div class="dashboard-stat">
          <span class="dashboard-stat__label dashboard-stat__label--blue" data-i18n="inProgress">In progress</span>
          <span class="dashboard-stat__value" id="countInProgress">0</span>
        </div>
        <span class="dashboard-summary__divider" aria-hidden="true"></span>
        <div class="dashboard-stat">
          <span class="dashboard-stat__label dashboard-stat__label--red" data-i18n="urgentFilter">(≤ 3 days)</span>
          <span class="dashboard-stat__value" id="countUrgent">0</span>
        </div>
        <span class="dashboard-summary__divider" aria-hidden="true"></span>
        <div class="dashboard-stat">
          <span class="dashboard-stat__label dashboard-stat__label--green" data-i18n="finish">Finished</span>
          <span class="dashboard-stat__value" id="countFinish">0</span>
        </div>
      </div>

      <button class="button-add" id="btnOpenModal">
        <span class="button-add__icon">+</span>
        <span data-i18n="add">Add</span>
      </button>
    </section>

    <!-- แถบควบคุม: สลับแท็บ (In progress / Finished) และช่องค้นหา -->
    <section class="task-controls">
      <div class="task-controls__tabs">
        <button class="task-controls__tab task-controls__tab--active" type="button" data-tab="in-progress" aria-pressed="true" data-i18n="inProgress">In progress</button>
        <button class="task-controls__tab" type="button" data-tab="finish" aria-pressed="false" data-i18n="finish">Finished</button>
      </div>

      <div class="task-controls__search-group">
        <div class="task-controls__search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" aria-label="Search tasks" placeholder="Search tasks">
        </div>
        <button class="task-controls__sort-button" id="btnSort" title="Sort by earliest deadline" aria-label="Sort by earliest deadline" aria-pressed="true" data-sort-direction="ascending">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"></path>
            <path d="m6 11 6-6 6 6"></path>
          </svg>
        </button>
      </div>
    </section>

    <!-- แถบตัวกรองหมวดหมู่ -->
    <section class="task-filters" id="filterPills">
      <button class="task-filters__pill task-filters__pill--active" type="button" data-filter="All" aria-pressed="true" data-i18n="all">All</button>
      <button class="task-filters__pill" type="button" data-filter="urgent" aria-pressed="false" data-i18n="urgentFilter">(≤ 3 days)</button>
      <button class="task-filters__pill" type="button" data-filter="today" aria-pressed="false" data-i18n="todayFilter">Today</button>
      <button class="task-filters__pill" type="button" data-filter="overdue" aria-pressed="false" data-i18n="overdueFilter">Overdue</button>
      <button class="task-filters__pill" type="button" data-filter="Jobs" aria-pressed="false" data-i18n="jobs">Jobs</button>
      <button class="task-filters__pill" type="button" data-filter="Study" aria-pressed="false" data-i18n="study">Study</button>
      <button class="task-filters__pill" type="button" data-filter="Freelance" aria-pressed="false" data-i18n="freelance">Freelance</button>
      <button class="task-filters__pill" type="button" data-filter="Finance" aria-pressed="false" data-i18n="finance">Finance</button>
    </section>

    <!-- รายการงานจะถูกโหลดจากบัญชีและแสดงผลด้วย script.js -->
    <section class="task-list" id="taskListContainer"></section>

  </main>

  <!-- หน้าต่าง Modal สำหรับเพิ่มงานใหม่ (เมื่อกดปุ่ม + Add) -->
  <div class="modal" id="addModal">
    <div class="modal__content">
      <div class="modal__header">
        <h3 id="modalTitle">Add task</h3>
        <button class="modal__close-button" id="btnCloseModal" aria-label="Close">&times;</button>
      </div>
      <form id="addTaskForm" class="task-form">
        <div class="form-field">
          <label for="taskTitleInput"><span data-i18n="title">Task title</span> <span class="form-field__required">*</span></label>
          <input type="text" id="taskTitleInput" required maxlength="120" placeholder="Enter a task title">
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="taskCategoryInput" data-i18n="category">Category</label>
            <select id="taskCategoryInput">
              <option value="Jobs" data-i18n="jobs">Jobs</option>
              <option value="Study" data-i18n="study">Study</option>
              <option value="Freelance" data-i18n="freelance">Freelance</option>
              <option value="Finance" data-i18n="finance">Finance</option>
            </select>
          </div>
        </div>
        <div class="form-row form-row--split">
          <div class="form-field">
            <label for="taskDateInput"><span data-i18n="deadline">Deadline</span> <span class="form-field__required">*</span></label>
            <input type="date" id="taskDateInput" required>
          </div>
          <div class="form-field">
            <label for="taskTimeInput" data-i18n="timeOptional">Time (optional)</label>
            <input type="time" id="taskTimeInput">
          </div>
        </div>
        <div class="form-field">
          <label for="taskFollowUpDateInput" data-i18n="followUpDate">Follow-up date (optional)</label>
          <input type="date" id="taskFollowUpDateInput">
        </div>
        <div class="form-field">
          <label for="taskDescInput" data-i18n="details">Additional details (optional)</label>
          <textarea id="taskDescInput" rows="4" placeholder="Add any details or notes..."></textarea>
        </div>
        <div class="task-form__subtask-section">
          <label data-i18n="subProgress">Subtasks</label>
          <div id="subtaskFormList"></div>
          <button type="button" class="task-form__add-step-button" id="btnAddStep">
            <span id="addStepLabel">Add step</span>
            <span class="task-form__step-number" id="addStepNumber">1</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
        <div class="modal__footer">
          <button type="button" class="button-delete" id="btnDeleteModal" hidden data-i18n="delete">Delete</button>
          <button type="button" class="button-cancel" id="btnCancelModal" data-i18n="cancel">Cancel</button>
          <button type="submit" class="button-submit" data-i18n="save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal" id="actionConfirmModal" aria-hidden="true">
    <section class="modal__content modal__content--confirmation" role="dialog" aria-modal="true" aria-labelledby="actionConfirmTitle" aria-describedby="actionConfirmMessage">
      <div class="modal__header">
        <h3 id="actionConfirmTitle">Confirm action</h3>
        <button type="button" class="modal__close-button" id="actionConfirmClose" aria-label="Close">&times;</button>
      </div>
      <p class="modal__message" id="actionConfirmMessage"></p>
      <div class="modal__footer">
        <button type="button" class="button-cancel" id="actionConfirmCancel" data-i18n="cancel">Cancel</button>
        <button type="button" class="button-submit" id="actionConfirmAccept" data-i18n="confirm">Confirm</button>
      </div>
    </section>
  </div>

  <!-- ลิงก์ไปยังไฟล์ JavaScript -->
  <script src="../site-pages.js"></script>
  <script src="../supabase-config.js"></script>
  <script src="../script.js"></script>
  <script src="../supabase-auth.js"></script>
</body>
</html>
