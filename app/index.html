<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage tasks and deadlines with clear categories, subtasks, and progress tracking.">
  <meta name="theme-color" content="#0099ff">
  <link rel="icon" href="../Asset/Deadline-512.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Deadline. - Manage deadlines</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- ลิงก์ไปยังไฟล์ CSS -->
  <link rel="stylesheet" href="../style.css">
</head>
<body data-auth-page="dashboard">

  <!-- แถบเมนูด้านบน -->
  <nav class="navbar">
    <div class="navbar-inner">
    <div class="logo">
      <img src="../Asset/Deadline-512.png" alt="Deadline">
      <span class="logo-name">Deadline<span class="logo-dot">.</span></span>
    </div>
    <div class="profile-wrapper">
      <button type="button" class="user-profile" id="btnProfile" aria-expanded="false" aria-label="Open profile menu">
        <div class="avatar">
          <img class="avatar-img" src="../Asset/MNSW New Profile.png" alt="User profile">
        </div>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="profile-menu" id="profileMenu">
        <div class="profile-account">
          <span id="accountLabel">Logged-in account</span>
          <strong id="accountEmail" data-i18n="previewAccount">Preview mode (not authenticated)</strong>
        </div>
        <p class="auth-status" id="authStatus" role="status" aria-live="polite" hidden></p>
        <button type="button" class="profile-row theme-row" id="themeToggle">
          <span class="theme-icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
            </svg>
          </span>
          <span id="themeLabel">Switch theme</span>
          <span class="theme-state" id="themeState">Light</span>
        </button>
        <button type="button" class="profile-row theme-row" id="languageToggle">
          <span class="theme-icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </span>
          <span id="languageLabel">Language</span>
          <span class="theme-state" id="languageState">English</span>
        </button>
        <a class="profile-row profile-row-link" href="../settings/" data-i18n="settings">Settings</a>
        <a class="profile-row profile-row-link" id="loginMenuLink" href="../login/" data-i18n="Sign in">Sign in</a>
        <hr>
        <a class="profile-row profile-row-link" href="../about/" data-i18n="about">About Deadline</a>
        <a class="profile-row profile-row-link" href="../faq/" data-i18n="faq">FAQ</a>
        <a class="profile-row profile-row-link" href="../privacy/" data-i18n="privacy">Privacy</a>
        <button type="button" class="profile-row sign-out" id="signOutButton" data-i18n="signOut" hidden>Sign out</button>
      </div>
    </div>
    </div>
  </nav>

  <!-- พื้นที่เนื้อหาหลัก -->
  <main class="container">
    
    <!-- ส่วนหัว: วันที่และชื่อหน้า -->
    <header class="page-header">
      <p class="current-date" id="currentDate">Sunday, November 22, 2026</p>
      <h1 class="page-title" data-i18n="pageTitle">Manage deadlines</h1>
    </header>
    <p class="task-operation-status" id="taskOperationStatus" role="alert" aria-live="polite" hidden></p>

    <!-- แถบสรุปสถานะ และปุ่ม + Add -->
    <section class="summary-bar">
      <div class="stats-card">
        <div class="stat-item">
          <span class="stat-label blue" data-i18n="inProgress">In progress</span>
          <span class="stat-value" id="countInProgress">0</span>
        </div>
        <span class="stat-divider" aria-hidden="true"></span>
        <div class="stat-item">
          <span class="stat-label red" data-i18n="urgentFilter">(≤ 3 days)</span>
          <span class="stat-value" id="countUrgent">0</span>
        </div>
        <span class="stat-divider" aria-hidden="true"></span>
        <div class="stat-item">
          <span class="stat-label green" data-i18n="finish">Finish</span>
          <span class="stat-value" id="countFinish">0</span>
        </div>
      </div>

      <button class="btn-add" id="btnOpenModal">
        <span class="btn-add-icon">+</span>
        <span data-i18n="add">Add</span>
      </button>
    </section>

    <!-- แถบควบคุม: สลับแท็บ (In progress / Finish) และช่องค้นหา -->
    <section class="controls-bar">
      <div class="status-tabs">
        <button class="tab-btn active" data-tab="in-progress" data-i18n="inProgress">In progress</button>
        <button class="tab-btn" data-tab="finish" data-i18n="finish">Finish</button>
      </div>

      <div class="search-sort-group">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search for a schedule">
        </div>
        <button class="btn-sort" id="btnSort" title="Sort deadlines" aria-label="Sort deadlines">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 15l5 5 5-5"></path>
            <path d="M7 9l5-5 5 5"></path>
          </svg>
        </button>
      </div>
    </section>

    <!-- แถบตัวกรองหมวดหมู่ -->
    <section class="filter-pills" id="filterPills">
      <button class="pill active" data-filter="All" data-i18n="all">All</button>
      <button class="pill" data-filter="urgent" data-i18n="urgentFilter">(≤ 3 days)</button>
      <button class="pill" data-filter="today" data-i18n="todayFilter">Today</button>
      <button class="pill" data-filter="overdue" data-i18n="overdueFilter">Overdue</button>
      <button class="pill" data-filter="Jobs" data-i18n="jobs">Jobs</button>
      <button class="pill" data-filter="Study" data-i18n="study">Study</button>
      <button class="pill" data-filter="Freelance" data-i18n="freelance">Freelance</button>
      <button class="pill" data-filter="Finance" data-i18n="finance">Finance</button>
    </section>

    <!-- รายการงานจะถูกโหลดจากบัญชีและแสดงผลด้วย script.js -->
    <section class="task-list-container" id="taskListContainer"></section>

  </main>

  <!-- หน้าต่าง Modal สำหรับเพิ่มงานใหม่ (เมื่อกดปุ่ม + Add) -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Add schedule</h3>
        <button class="btn-close-modal" id="btnCloseModal" aria-label="Close">&times;</button>
      </div>
      <form id="addTaskForm">
        <div class="form-group">
          <label><span data-i18n="title">Title</span> <span class="required">*</span></label>
          <input type="text" id="taskTitleInput" required maxlength="120" placeholder="add title....">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label data-i18n="category">Category</label>
            <select id="taskCategoryInput">
              <option value="Jobs" data-i18n="jobs">Jobs</option>
              <option value="Study" data-i18n="study">Study</option>
              <option value="Freelance" data-i18n="freelance">Freelance</option>
              <option value="Finance" data-i18n="finance">Finance</option>
            </select>
          </div>
        </div>
        <div class="form-row split-row">
          <div class="form-group">
            <label><span data-i18n="deadline">Deadline</span> <span class="required">*</span></label>
            <input type="date" id="taskDateInput" required>
          </div>
          <div class="form-group">
            <label data-i18n="timeOptional">Time (optional)</label>
            <input type="time" id="taskTimeInput">
          </div>
        </div>
        <div class="form-group">
          <label data-i18n="details">Details / Additional Notes</label>
          <textarea id="taskDescInput" rows="4" placeholder="Specify the scope of work, conditions, or necessary preparations..."></textarea>
        </div>
        <div class="sub-progress-form">
          <label data-i18n="subProgress">Sub-progress</label>
          <div id="subtaskFormList"></div>
          <button type="button" class="btn-add-step" id="btnAddStep">
            <span id="addStepLabel">Add step</span>
            <span class="add-step-number" id="addStepNumber">1</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-delete" id="btnDeleteModal" hidden data-i18n="delete">Delete</button>
          <button type="button" class="btn-cancel" id="btnCancelModal" data-i18n="cancel">Cancel</button>
          <button type="submit" class="btn-submit" data-i18n="save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ลิงก์ไปยังไฟล์ JavaScript -->
  <script src="../supabase-config.js"></script>
  <script src="../script.js"></script>
  <script src="../supabase-auth.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
