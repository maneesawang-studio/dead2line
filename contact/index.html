<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Contact Deadline support about your account, privacy, or a technical issue.">
  <meta name="robots" content="noindex,follow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" data-theme-color="light" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" data-theme-color="dark" media="(prefers-color-scheme: dark)">
  <script>
    (() => {
      let preference = "system";
      try {
        const savedTheme = localStorage.getItem("deadline-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          preference = savedTheme;
        } else {
          localStorage.removeItem("deadline-theme");
        }
      } catch (error) {
        preference = "system";
      }
      const systemIsDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = preference === "system" ? (systemIsDark ? "dark" : "light") : preference;
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
        meta.media = meta.dataset.themeColor === theme ? "all" : "not all";
      });
    })();
  </script>
  <meta name="apple-mobile-web-app-title" content="Deadline">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="96x96" href="../Asset/Deadline-96.png">
  <link rel="apple-touch-icon" sizes="512x512" href="../Asset/Deadline-white-512.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Deadline | Contact support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body class="site-page site-page--mobile-flow" data-auth-page="public" data-site-title="contactTitle" data-site-description="contactDescription" data-nav-active="contact">
  <nav class="site-navigation" id="siteNavigation"></nav>

  <main class="site-page__main site-page__main--login">
    <a class="site-page__mobile-back" href="../settings/" aria-label="Back to settings" data-site-i18n-aria-label="backToSettings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </a>
    <section class="site-card login-card contact-card" aria-labelledby="contactHeading">
      <p class="site-page__eyebrow" data-site-i18n="contactEyebrow">SUPPORT</p>
      <h1 id="contactHeading" data-site-i18n="contactHeading">How can we help?</h1>
      <p class="site-page__lead" data-site-i18n="contactLead">Send a message to the Deadline support team.</p>

      <form class="login-card__form" id="supportContactForm">
        <div class="site-form-field">
          <label for="supportEmail" data-site-i18n="contactEmailLabel">Your email</label>
          <input type="email" id="supportEmail" name="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="site-form-field">
          <label for="supportTopic" data-site-i18n="contactTopicLabel">What do you need help with?</label>
          <select id="supportTopic" name="topic" required>
            <option value="general" data-site-i18n="contactTopicGeneral">General question</option>
            <option value="technical" data-site-i18n="contactTopicTechnical">Technical issue</option>
            <option value="account" data-site-i18n="contactTopicAccount">Account access</option>
            <option value="privacy" data-site-i18n="contactTopicPrivacy">Privacy or account deletion</option>
          </select>
        </div>
        <div class="site-form-field">
          <label for="supportMessage" data-site-i18n="contactMessageLabel">Message</label>
          <textarea id="supportMessage" name="message" rows="6" minlength="10" maxlength="3000" required></textarea>
        </div>
        <input class="contact-card__honeypot" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="contact-card__privacy-note" data-site-i18n="contactPrivacyNote">Don't include passwords, verification codes, or sensitive task details. Replies will be sent to the email you provide.</p>
        <button class="site-button" id="supportSubmit" type="submit" data-site-i18n="contactSend">Send message</button>
      </form>
      <p class="status-message" id="supportContactStatus" role="status" aria-live="polite" hidden></p>
      <a class="contact-card__privacy-link" href="../privacy/" data-site-i18n="privacy">Privacy</a>
    </section>
  </main>

  <footer class="site-footer">
    <span data-site-i18n="footerNote">Stay organized and keep your deadlines in sight.</span>
    <nav class="site-footer__links" aria-label="Footer navigation" data-site-i18n-aria-label="footerNavigation">
      <a href="../" data-site-i18n="homeNav">Home</a>
      <a href="../faq/" data-site-i18n="faqNav">FAQ</a>
      <a href="../privacy/" data-site-i18n="privacy">Privacy</a>
    </nav>
  </footer>

  <script src="../site-pages.js"></script>
  <script src="../supabase-config.js"></script>
  <script src="../supabase-auth.js"></script>
</body>
</html>
