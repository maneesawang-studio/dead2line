<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to Deadline.">
  <title>Deadline. - Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="site-page" data-auth-page="login" data-site-title="loginTitle" data-nav-active="login">
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="../" aria-label="Deadline">
        <img src="../Asset/Deadline-512.png" alt="Deadline">
        <span class="logo-name">Deadline<span class="logo-dot">.</span></span>
      </a>
      <div class="profile-wrapper">
        <button type="button" class="user-profile" id="btnProfile" aria-expanded="false" aria-label="Open profile menu" hidden>
          <div class="avatar">
            <span class="avatar-initials" aria-hidden="true">U</span>
            <img class="avatar-img" alt="User profile" hidden>
          </div>
          <span class="profile-email" id="profileEmail"></span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="profile-menu" id="profileMenu">
          <div class="profile-account">
            <span data-site-i18n="account">Account</span>
            <strong id="accountEmail" data-site-i18n="previewAccount">Preview mode (not authenticated)</strong>
          </div>
          <button type="button" class="profile-row theme-row" id="themeToggle">
            <span class="theme-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
              </svg>
            </span>
            <span id="themeLabel" data-site-i18n="switchTheme">Switch theme</span>
            <span class="theme-state" id="themeState">Light</span>
          </button>
          <button type="button" class="profile-row theme-row" id="languageToggle">
            <span class="theme-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </span>
            <span id="languageLabel" data-site-i18n="language">Language</span>
            <span class="theme-state" id="languageState">English</span>
          </button>
          <a class="profile-row profile-row-link" href="../settings/" data-site-i18n="settings">Settings</a>
          <a class="profile-row profile-row-link" href="../login/" id="loginMenuLink" data-site-i18n="signIn">Sign in</a>
          <hr>
          <a class="profile-row profile-row-link" href="../privacy/" data-site-i18n="privacy">Privacy</a>
          <button type="button" class="profile-row sign-out" id="signOutButton" data-site-i18n="signOut" hidden>Sign out</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="site-main login-main">
    <section class="site-card login-card" aria-labelledby="loginHeading">
      <div class="login-brand">
        <img src="../Asset/Deadline-512.png" alt="">
        <span>Deadline<span class="logo-dot">.</span></span>
      </div>
      <h1 id="loginHeading" data-site-i18n="loginHeading">Welcome back</h1>
      <p class="site-lead" data-site-i18n="loginLead">Sign in to continue to your deadlines.</p>

      <form id="loginForm" class="login-form">
        <div class="site-form-group">
          <label for="loginEmail" data-site-i18n="email">Email</label>
          <input type="email" id="loginEmail" name="email" autocomplete="email" required>
        </div>
        <div class="site-form-group">
          <label for="loginPassword" data-site-i18n="password">Password</label>
          <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
        </div>
        <p class="auth-status" id="authStatus" role="status" aria-live="polite" hidden></p>
        <button class="site-primary-button" id="loginSubmit" type="submit" data-site-i18n="signInButton">Sign in</button>
      </form>

      <p class="login-note" data-site-i18n="loginNote">Use an account that has been created in Supabase Auth.</p>
      <div class="site-inline-links">
        <a href="../about/" data-site-i18n="aboutNav">About</a>
        <a href="../faq/" data-site-i18n="faqNav">FAQ</a>
      </div>
    </section>
  </main>

  <script src="../site-pages.js"></script>
  <script src="../supabase-config.js"></script>
  <script src="../supabase-auth.js"></script>
</body>
</html>
