<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Deadline preferences and account settings.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" data-theme-color="light" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" data-theme-color="dark" media="(prefers-color-scheme: dark)">
  <script>
    (() => {
      let preference = "system";
      try {
        const savedTheme = localStorage.getItem("deadline-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          preference = savedTheme;
        } else {
          localStorage.removeItem("deadline-theme");
        }
      } catch (error) {
        preference = "system";
      }
      const systemIsDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = preference === "system" ? (systemIsDark ? "dark" : "light") : preference;
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
        meta.media = meta.dataset.themeColor === theme ? "all" : "not all";
      });
    })();
  </script>
  <meta name="apple-mobile-web-app-title" content="Deadline">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="96x96" href="/Asset/Deadline-96.png">
  <link rel="apple-touch-icon" sizes="512x512" href="../Asset/Deadline-white-512.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <title>Deadline | Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body class="site-page site-page--mobile-flow" data-auth-page="public" data-site-title="settingsHeading" data-nav-active="settings">
  <nav class="site-navigation">

        <img src="../Asset/Deadline-512.png" alt="Deadline">

            <circle cx="12" cy="12" r="4"></circle>

          </svg>

      </button>
      <button type="button" class="account-menu__item account-menu__item--theme" id="languageToggle">

            <circle cx="12" cy="12" r="10"></circle>

            <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"></path>
          </svg>
          <span data-site-i18n="contactNav">Contact</span>

      </nav>

    <a class="site-page__back-link" href="../" data-site-i18n="backToTasks">Back to home</a>
  </main>
  <footer class="site-footer" data-site-i18n="footerNote">Stay organized and keep your deadlines in sight.</footer>

</html>
