<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Deadline preferences and account settings.">
  <title>Deadline. - Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="site-page" data-auth-page="public" data-site-title="settings">
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="../" aria-label="Deadline">
        <img src="../Asset/Deadline-512.png" alt="Deadline">
        <span class="logo-name">Deadline<span class="logo-dot">.</span></span>
      </a>
    </div>
  </nav>
  <main class="site-main">
    <header class="site-page-header">
      <p class="site-eyebrow">Preferences</p>
      <h1 data-site-i18n="settingsHeading">Settings</h1>
    </header>
    <section class="site-card site-notice-card">
      <h2 data-site-i18n="appearanceHeading">Appearance</h2>
      <button type="button" class="profile-row theme-row" id="themeToggle">
        <span data-site-i18n="theme">Theme</span>
        <span class="theme-state" id="themeState">Light</span>
      </button>
      <button type="button" class="profile-row theme-row" id="languageToggle">
        <span data-site-i18n="language">Language</span>
        <span class="theme-state" id="languageState">English</span>
      </button>
    </section>
    <a class="site-back-link" href="../" data-site-i18n="backToTasks">Back to tasks</a>
  </main>
  <footer class="site-footer" data-site-i18n="footerNote">A clearer way to keep deadlines in sight.</footer>
  <script src="../site-pages.js"></script>
  <script src="../supabase-config.js"></script>
  <script src="../supabase-auth.js"></script>
</body>
</html>
